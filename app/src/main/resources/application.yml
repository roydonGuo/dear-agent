server:
  port: 520
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
#  profiles:
#    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    openai:
      api-key: @dashscope.api.key@
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: glm-5
          temperature: 0.7
          maxTokens: 50000
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/
        api-key: @dashscope.api.key@
        options:
          model: text-embedding-v4
          dimensions: 1024
